<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="検査写真">
<title>各種検査指摘 写真報告書</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Hiragino Sans','Yu Gothic',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
.top-header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:0.5px solid #e0e0e0;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;min-height:48px}
.top-header h1{font-size:15px;font-weight:600;color:#1a1a1a}
.back-btn{font-size:14px;color:#378ADD;cursor:pointer;background:none;border:none;padding:4px 0}
.screen{display:none}
.screen.active{display:block}

/* 設定画面 */
.settings-wrap{padding:16px;max-width:480px;margin:0 auto}
.field-group{background:#fff;border-radius:12px;border:0.5px solid #e0e0e0;margin-bottom:12px;overflow:hidden}
.field-group label{display:block;font-size:11px;font-weight:600;color:#888;padding:10px 14px 0;letter-spacing:0.05em}
.field-group input{width:100%;font-size:14px;padding:6px 14px 10px;border:none;outline:none;color:#1a1a1a;background:transparent}
.field-group input::placeholder{color:#bbb}
.primary-btn{width:100%;padding:14px;border:none;border-radius:12px;background:#378ADD;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:8px}
.primary-btn:active{opacity:0.85}
.note{font-size:11px;color:#aaa;text-align:center;padding:4px}

/* 検索画面 */
#searchScreen main{padding:12px;max-width:480px;margin:0 auto}
.search-card{background:#fff;border-radius:12px;border:0.5px solid #e0e0e0;padding:14px;margin-bottom:12px}
.search-card h3{font-size:13px;font-weight:600;color:#555;margin-bottom:10px}
.filter-label{font-size:10px;font-weight:600;color:#aaa;margin-bottom:4px;letter-spacing:0.05em}
.filter-input{padding:8px 10px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:13px;outline:none;color:#1a1a1a;background:#fafafa;width:100%}
.filter-input:focus{border-color:#378ADD;background:#fff}
.filter-row{margin-bottom:10px}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.date-row{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-bottom:10px}
.date-sep{font-size:12px;color:#aaa;text-align:center}
.search-btn{width:100%;padding:12px;border:none;border-radius:10px;background:#378ADD;color:#fff;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.search-btn:active{opacity:0.85}
.search-btn.loading{opacity:0.6;pointer-events:none}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:4px}
.spinner.blue{border-color:rgba(55,138,221,0.3);border-top-color:#378ADD}
@keyframes spin{to{transform:rotate(360deg)}}

/* 報告書画面 */
#reportScreen main{padding:12px;max-width:480px;margin:0 auto}
.save-ind{font-size:10px;color:#1D9E75;white-space:nowrap}

/* 指摘カード */
.rec-card{background:#fff;border-radius:12px;border:0.5px solid #e0e0e0;margin-bottom:12px;overflow:hidden}
.rec-card-header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f8f8f8;border-bottom:0.5px solid #e8e8e8}
.rec-checkbox{width:22px;height:22px;border-radius:6px;border:1.5px solid #ddd;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:13px;color:#fff;transition:all 0.15s}
.rec-checkbox.checked{background:#378ADD;border-color:#378ADD}
.rec-card-title{font-size:13px;font-weight:600;color:#1a1a1a;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-badge{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;flex-shrink:0}

/* 是正前後タイトル行 */
.photo-title-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:0.5px solid #e8e8e8}
.photo-title-cell{text-align:center;font-size:11px;font-weight:700;padding:5px;color:#555;background:#f0f0f0}
.photo-title-cell:first-child{border-right:0.5px solid #e8e8e8}

/* 写真ペア行 */
.pair-row{border-bottom:0.5px solid #f0f0f0}
.photos-grid{display:grid;grid-template-columns:1fr 1fr}
.photo-slot{position:relative;aspect-ratio:4/3;cursor:pointer;overflow:hidden;background:#f8f8f8;display:flex;align-items:center;justify-content:center}
.photo-slot:first-child{border-right:0.5px solid #e8e8e8}
.photo-slot img{width:100%;height:100%;object-fit:cover;display:block}
.photo-empty{display:flex;flex-direction:column;align-items:center;gap:4px}
.photo-empty .icon{font-size:20px;color:#ddd}
.photo-empty span{font-size:9px;color:#ccc}
.photo-check{position:absolute;top:4px;right:4px;width:16px;height:16px;background:#22c55e;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.at-badge-photo{position:absolute;top:4px;left:4px;font-size:7px;background:#faeeda;color:#854F0B;padding:1px 3px;border-radius:2px;font-weight:700}

/* コメント行 */
.comment-grid{display:grid;grid-template-columns:1fr 1fr;border-top:0.5px solid #f0f0f0}
.comment-cell{padding:5px 8px}
.comment-cell:first-child{border-right:0.5px solid #f0f0f0}
.comment-cell textarea{width:100%;font-size:11px;border:none;outline:none;color:#333;background:transparent;resize:none;font-family:inherit;line-height:1.4}

/* 写真行追加ボタン */
.add-pair-btn{width:100%;padding:7px;border:none;background:#f5f5f5;color:#378ADD;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;border-top:0.5px solid #e8e8e8}
.add-pair-btn:active{background:#e8f3ff}

/* 出力ボタン */
.output-bar{position:sticky;bottom:0;background:#fff;border-top:0.5px solid #e0e0e0;padding:10px 12px;display:flex;gap:8px;z-index:40}
.out-btn{flex:1;padding:12px 6px;border:0.5px solid #d8d8d8;border-radius:10px;background:#fff;color:#333;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.out-btn.pdf{color:#378ADD;border-color:#b8d8f8}
.out-btn.upload{color:#854F0B;border-color:#f0d0a0;background:#fffaf0}
.out-btn.sheets{color:#1D9E75;border-color:#b0e0cc}
.out-btn:active{transform:scale(0.97)}
.out-btn.loading{opacity:0.6;pointer-events:none}

.selected-count{font-size:11px;color:#378ADD;text-align:center;padding:6px 12px 0}

/* モーダル */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));width:100%;max-width:480px;transform:translateY(20px);transition:transform 0.2s}
.overlay.open .sheet{transform:translateY(0)}
.sheet-title{font-size:13px;font-weight:600;color:#888;text-align:center;margin-bottom:14px}
.sheet-btn{width:100%;padding:15px;border:none;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sheet-btn.cam{background:#dbeeff;color:#185FA5}
.sheet-btn.gal{background:#d4f0e4;color:#0F6E56}
.sheet-btn.del{background:#fff0f0;color:#cc3333}
.sheet-btn.cancel{background:#f0f0f0;color:#888}
.sheet-btn:active{opacity:0.75}

.toast{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#222;color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;opacity:0;transition:opacity 0.25s;pointer-events:none;z-index:200;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1}
input[type=file]{display:none}

.empty-state{text-align:center;padding:48px 24px;color:#bbb}
.empty-state .emoji{font-size:40px;margin-bottom:12px}
.empty-state p{font-size:14px;line-height:1.6}

/* PDF描画用 */
#pdfRender{position:fixed;left:-9999px;top:0;width:794px;background:#fff;font-family:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif;z-index:-1}
.pdf-page{width:794px;padding:20px 24px 16px;background:#fff}
.pdf-main-title{text-align:center;font-size:14px;font-weight:700;letter-spacing:0.1em;margin-bottom:2px}
.pdf-sub-title{text-align:center;font-size:11px;color:#555;margin-bottom:10px}
.pdf-rec{margin-bottom:14px;border:0.5px solid #bbb}
.pdf-rec-header{background:#f0f0f0;padding:4px 8px;font-size:10px;font-weight:700;color:#333;border-bottom:0.5px solid #bbb}
.pdf-photo-title-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:0.5px solid #bbb}
.pdf-photo-title-cell{text-align:center;font-size:9px;font-weight:700;padding:3px;background:#f8f8f8;color:#555}
.pdf-photo-title-cell:first-child{border-right:0.5px solid #bbb}
.pdf-pair{border-bottom:0.5px solid #ddd}
.pdf-pair:last-child{border-bottom:none}
.pdf-photos-row{display:grid;grid-template-columns:1fr 1fr}
.pdf-photo-cell{position:relative}
.pdf-photo-cell:first-child{border-right:0.5px solid #ddd}
.pdf-photo-cell img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.pdf-photo-empty{width:100%;aspect-ratio:4/3;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:9px;color:#bbb}
.pdf-comment-row{display:grid;grid-template-columns:1fr 1fr;border-top:0.5px solid #eee}
.pdf-comment-cell{padding:3px 6px;font-size:8px;color:#444;line-height:1.5;min-height:20px}
.pdf-comment-cell:first-child{border-right:0.5px solid #eee}
.pdf-page-num{text-align:right;font-size:8px;color:#aaa;margin-top:4px}
</style>
</head>
<body>

<!-- 設定画面 -->
<div id="settingsScreen" class="screen">
  <div class="top-header"><h1>⚙️ Airtable設定</h1></div>
  <div class="settings-wrap">
    <div class="field-group">
      <label>PERSONAL ACCESS TOKEN</label>
      <input type="password" id="settingToken" placeholder="patXXXXXXXXX">
    </div>
    <button class="primary-btn" id="saveSettingsBtn">保存して開始</button>
    <p class="note">APIキーはこの端末のみに保存されます</p>
  </div>
</div>

<!-- 検索画面 -->
<div id="searchScreen" class="screen">
  <div class="top-header">
    <h1>📋 検査指摘 写真報告書</h1>
    <button class="back-btn" id="settingsBtn" style="color:#aaa;font-size:12px">⚙️</button>
  </div>
  <main>
    <div class="search-card">
      <h3>🔍 絞り込み条件</h3>
      <div class="filter-row">
        <div class="filter-label">検査名</div>
        <select class="filter-input" id="filterKensaName">
          <option value="">すべて</option>
        </select>
      </div>
      <div class="filter-label">検査日（範囲）</div>
      <div class="date-row">
        <input type="date" class="filter-input" id="filterDateFrom">
        <div class="date-sep">〜</div>
        <input type="date" class="filter-input" id="filterDateTo">
      </div>
      <div class="filter-grid">
        <div>
          <div class="filter-label">進捗</div>
          <select class="filter-input" id="filterProgress">
            <option value="">すべて</option>
            <option>是正中</option><option>業振済</option><option>完了</option>
            <option>確認済</option><option>仕様</option><option>施工前</option>
            <option>保修中</option><option>要注意</option><option>業者変更</option>
            <option>再補修</option><option>追加</option>
          </select>
        </div>
        <div>
          <div class="filter-label">業者</div>
          <input type="text" class="filter-input" id="filterGyosha" placeholder="任意">
        </div>
      </div>
      <button class="search-btn" id="searchBtn">
        <span class="spinner blue" id="searchSpinner" style="display:none"></span>
        Airtableから取得
      </button>
    </div>
    <div id="searchEmpty" class="empty-state"><div class="emoji">🔍</div><p>条件を入力して<br>「Airtableから取得」してください</p></div>
  </main>
</div>

<!-- 報告書編集画面 -->
<div id="reportScreen" class="screen">
  <div class="top-header">
    <button class="back-btn" id="backBtn">← 検索</button>
    <span class="save-ind" id="saveInd">💾 保存済</span>
  </div>
  <main>
    <div id="selectedCount" class="selected-count"></div>
    <div id="recCards" style="padding:12px 12px 80px"></div>
  </main>
  <div class="output-bar">
    <button class="out-btn pdf" id="pdfBtn">📄 PDF</button>
    <button class="out-btn upload" id="uploadBtn">🔗 Airtable</button>
    <button class="out-btn sheets" id="sheetsBtn">📊 CSV</button>
  </div>
</div>

<!-- 写真シート -->
<div class="overlay" id="photoOverlay">
  <div class="sheet">
    <div class="sheet-title" id="sheetTitle">写真を選択</div>
    <button class="sheet-btn cam" id="camBtn">📷 カメラで撮影</button>
    <button class="sheet-btn gal" id="galBtn">🖼 ライブラリから選択</button>
    <button class="sheet-btn del" id="delPhotoBtn" style="display:none">🗑 写真を削除</button>
    <button class="sheet-btn cancel" id="photoCancelBtn">キャンセル</button>
  </div>
</div>

<input type="file" id="fileCamera" accept="image/*" capture="environment">
<input type="file" id="fileGallery" accept="image/*">
<div id="pdfRender"></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const SETTINGS_KEY  = 'genba_v4_settings';
const LOCAL_KEY     = 'genba_v4_local';
const BASE_ID       = 'app8zPFrrXIWNhYW5';
const TBL_NISSHIN   = 'tblfk1A5vtpJpR3Jy';
const TBL_SHITEKI   = 'tbl231zvyOlWS6iCs';

let items = [];      // 取得した指摘（表示・編集用）
let activeSlot = null;
let saveTimer = null;

// ===== ユーティリティ =====
function toast(msg,dur=2500){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur)}
function todayStr(){const d=new Date();return`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`}
function todayJP(){return new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'})}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function loadSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY))||{}}catch(e){return{}}}
function saveSettings(s){localStorage.setItem(SETTINGS_KEY,JSON.stringify(s))}
function loadLocal(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||'{}')}catch(e){return{}}}

function progressColor(p){
  const m={'是正中':'#dbeeff','業振済':'#faeeda','完了':'#d4f0e4','確認済':'#d4f0e4','仕様':'#f0f0ec','施工前':'#f0f0ec','保修中':'#faeeda','要注意':'#faeeda','業者変更':'#faeeda','再補修':'#dbeeff','追加':'#dbeeff'};
  return m[p]||'#f0f0ec';
}

// ===== 設定 =====
document.getElementById('saveSettingsBtn').onclick=()=>{
  const token=document.getElementById('settingToken').value.trim();
  if(!token){toast('Tokenを入力してください');return}
  saveSettings({token});
  loadKensaNames();
  showScreen('searchScreen');
};
document.getElementById('settingsBtn').onclick=()=>{
  const s=loadSettings();
  document.getElementById('settingToken').value=s.token||'';
  showScreen('settingsScreen');
};

// ===== Airtable API =====
async function atGet(tableId,params=''){
  const s=loadSettings();
  const res=await fetch(`https://api.airtable.com/v0/${BASE_ID}/${tableId}${params}`,{headers:{'Authorization':`Bearer ${s.token}`}});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${res.status}`)}
  return res.json();
}

// 検査名ドロップダウン
async function loadKensaNames(){
  try{
    const data=await atGet(TBL_NISSHIN,'?fields[]=検査名&sort[0][field]=検査日&sort[0][direction]=desc');
    const sel=document.getElementById('filterKensaName');
    sel.innerHTML='<option value="">すべて</option>';
    const names=[...new Set((data.records||[]).map(r=>r.fields['検査名']).filter(Boolean))];
    names.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o)});
  }catch(e){}
}

// 写真圧縮
function compressImage(file){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1200;let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.70));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ===== 検索・取得 =====
document.getElementById('searchBtn').onclick=async()=>{
  const s=loadSettings();
  if(!s.token){toast('設定が必要です');showScreen('settingsScreen');return}

  const kensaName=document.getElementById('filterKensaName').value;
  const dateFrom=document.getElementById('filterDateFrom').value;
  const dateTo=document.getElementById('filterDateTo').value;
  const progress=document.getElementById('filterProgress').value;
  const gyosha=document.getElementById('filterGyosha').value.trim();

  const conds=[];
  if(kensaName) conds.push(`{検査名}="${kensaName}"`);
  if(progress)  conds.push(`{進捗}="${progress}"`);
  if(gyosha)    conds.push(`SEARCH("${gyosha}",ARRAYJOIN(ARRAYCOMPACT({業者})))`);
  if(dateFrom)  conds.push(`{検査日}>="${dateFrom}"`);
  if(dateTo)    conds.push(`{検査日}<="${dateTo}"`);

  const formula=conds.length>1?`AND(${conds.join(',')})`:conds[0]||'';
  let url=`?pageSize=100&sort[0][field]=指摘ID&sort[0][direction]=asc`;
  if(formula) url+=`&filterByFormula=${encodeURIComponent(formula)}`;

  const btn=document.getElementById('searchBtn');
  const sp=document.getElementById('searchSpinner');
  btn.classList.add('loading');sp.style.display='inline-block';btn.lastChild.textContent=' 取得中…';

  try{
    const data=await atGet(TBL_SHITEKI,url);
    const local=loadLocal();

    items=(data.records||[]).map(r=>{
      const f=r.fields;
      const atB=(f['指摘写真']||[]).map(a=>({url:a.url,isUrl:true}));
      const atA=(f['是正写真']||[]).map(a=>({url:a.url,isUrl:true}));
      const savedPairs=local[r.id]?.pairs;
      let pairs;
      if(savedPairs){
        pairs=savedPairs;
      }else{
        const maxLen=Math.max(1,atB.length,atA.length);
        pairs=[];
        for(let i=0;i<maxLen;i++){
          pairs.push({
            before:atB[i]?.url||null, beforeIsUrl:!!atB[i],
            after:atA[i]?.url||null,  afterIsUrl:!!atA[i],
            beforeComment:`指摘内容：${f['指摘内容']||''}`,
            afterComment:`是正内容：${f['是正内容']||''}`,
          });
        }
      }
      return{
        recId:r.id,
        selected: local[r.id]?.selected!==undefined ? local[r.id].selected : true,
        kensaName:f['検査名']||'',
        progress:f['進捗']||'',
        shitekiContent:f['指摘内容']||'',
        zeseiContent:f['是正内容']||'',
        gyosha:f['業者']||'',
        kensaDate:f['検査日']||'',
        pairs,
      };
    });

    if(items.length===0){toast('条件に合うレコードが見つかりません');return}
    toast(`${items.length}件取得しました`);
    renderReportScreen();
    showScreen('reportScreen');
  }catch(e){
    toast('取得エラー: '+e.message);
  }finally{
    btn.classList.remove('loading');sp.style.display='none';btn.lastChild.textContent='Airtableから取得';
  }
};

// ===== ローカル保存 =====
function saveLocal(){
  clearTimeout(saveTimer);
  document.getElementById('saveInd').textContent='⏳ 保存中…';
  saveTimer=setTimeout(()=>{
    try{
      const local=loadLocal();
      items.forEach(item=>{
        local[item.recId]={selected:item.selected,pairs:item.pairs};
      });
      localStorage.setItem(LOCAL_KEY,JSON.stringify(local));
      document.getElementById('saveInd').textContent='💾 保存済';
    }catch(e){toast('保存失敗：容量不足の可能性')}
  },800);
}

// ===== 報告書画面描画 =====
function renderReportScreen(){
  const container=document.getElementById('recCards');
  container.innerHTML='';
  updateSelectedCount();

  items.forEach((item,itemIdx)=>{
    const card=document.createElement('div');
    card.className='rec-card';

    // ヘッダー（チェック＋検査名）
    const hdr=document.createElement('div');
    hdr.className='rec-card-header';
    const chk=document.createElement('div');
    chk.className='rec-checkbox'+(item.selected?' checked':'');
    chk.textContent=item.selected?'✓':'';
    chk.onclick=()=>{item.selected=!item.selected;chk.className='rec-checkbox'+(item.selected?' checked':'');chk.textContent=item.selected?'✓':'';updateSelectedCount();saveLocal()};
    const titleEl=document.createElement('div');
    titleEl.className='rec-card-title';
    titleEl.textContent=`${itemIdx+1}. ${item.kensaName} ${item.shitekiContent}`;
    const bdg=document.createElement('span');
    bdg.className='rec-badge';
    bdg.style.background=progressColor(item.progress);
    bdg.textContent=item.progress;
    hdr.appendChild(chk);hdr.appendChild(titleEl);if(item.progress)hdr.appendChild(bdg);
    card.appendChild(hdr);

    // 是正前・是正後タイトル行
    const titleRow=document.createElement('div');
    titleRow.className='photo-title-row';
    titleRow.innerHTML='<div class="photo-title-cell">是　正　前</div><div class="photo-title-cell">是　正　後</div>';
    card.appendChild(titleRow);

    // 写真ペア行
    item.pairs.forEach((pair,pairIdx)=>{
      const pairDiv=document.createElement('div');
      pairDiv.className='pair-row';

      // 写真グリッド
      const grid=document.createElement('div');
      grid.className='photos-grid';

      ['before','after'].forEach(side=>{
        const slot=document.createElement('div');
        slot.className='photo-slot';
        const img=pair[side];
        const isUrl=pair[side+'IsUrl'];
        if(img){
          const imgEl=document.createElement('img');
          imgEl.src=img;imgEl.alt=side==='before'?'是正前':'是正後';
          slot.appendChild(imgEl);
          if(isUrl){const ab=document.createElement('span');ab.className='at-badge-photo';ab.textContent='Airtable';slot.appendChild(ab)}
          const chkEl=document.createElement('span');chkEl.className='photo-check';chkEl.textContent='✓';slot.appendChild(chkEl);
        }else{
          slot.innerHTML=`<div class="photo-empty"><div class="icon">📷</div><span>${side==='before'?'是正前':'是正後'}</span></div>`;
        }
        slot.onclick=()=>openPhotoSheet(itemIdx,pairIdx,side);
        grid.appendChild(slot);
      });
      pairDiv.appendChild(grid);

      // コメント行
      const cmtGrid=document.createElement('div');
      cmtGrid.className='comment-grid';
      ['before','after'].forEach(side=>{
        const cell=document.createElement('div');
        cell.className='comment-cell';
        const ta=document.createElement('textarea');
        ta.rows=2;
        ta.value=pair[side+'Comment']||'';
        ta.placeholder=side==='before'?'指摘内容：':'是正内容：';
        ta.oninput=()=>{pair[side+'Comment']=ta.value;saveLocal()};
        cell.appendChild(ta);
        cmtGrid.appendChild(cell);
      });
      pairDiv.appendChild(cmtGrid);
      card.appendChild(pairDiv);
    });

    // 写真行追加ボタン
    const addBtn=document.createElement('button');
    addBtn.className='add-pair-btn';
    addBtn.textContent='＋ 写真行を追加';
    addBtn.onclick=()=>{
      item.pairs.push({
        before:null,beforeIsUrl:false,beforeComment:`指摘内容：${item.shitekiContent}`,
        after:null,afterIsUrl:false,afterComment:`是正内容：${item.zeseiContent}`,
      });
      renderReportScreen();saveLocal();
    };
    card.appendChild(addBtn);
    container.appendChild(card);
  });
}

function updateSelectedCount(){
  const n=items.filter(i=>i.selected).length;
  document.getElementById('selectedCount').textContent=`${items.length}件取得　${n}件選択中（出力対象）`;
}

document.getElementById('backBtn').onclick=()=>showScreen('searchScreen');

// ===== 写真シート =====
function openPhotoSheet(itemIdx,pairIdx,side){
  activeSlot={itemIdx,pairIdx,side};
  const pair=items[itemIdx].pairs[pairIdx];
  document.getElementById('sheetTitle').textContent=side==='before'?'是正前の写真':'是正後の写真';
  document.getElementById('delPhotoBtn').style.display=(pair[side]&&!pair[side+'IsUrl'])?'flex':'none';
  document.getElementById('photoOverlay').classList.add('open');
}
document.getElementById('photoCancelBtn').onclick=()=>document.getElementById('photoOverlay').classList.remove('open');
document.getElementById('photoOverlay').onclick=e=>{if(e.target===document.getElementById('photoOverlay'))document.getElementById('photoOverlay').classList.remove('open')};
document.getElementById('camBtn').onclick=()=>{document.getElementById('photoOverlay').classList.remove('open');document.getElementById('fileCamera').click()};
document.getElementById('galBtn').onclick=()=>{document.getElementById('photoOverlay').classList.remove('open');document.getElementById('fileGallery').click()};
document.getElementById('delPhotoBtn').onclick=()=>{
  const {itemIdx,pairIdx,side}=activeSlot;
  const pair=items[itemIdx].pairs[pairIdx];
  pair[side]=null;pair[side+'IsUrl']=false;
  renderReportScreen();saveLocal();
  document.getElementById('photoOverlay').classList.remove('open');
};
async function handleFile(file){
  if(!file||!activeSlot)return;
  const compressed=await compressImage(file);
  const {itemIdx,pairIdx,side}=activeSlot;
  items[itemIdx].pairs[pairIdx][side]=compressed;
  items[itemIdx].pairs[pairIdx][side+'IsUrl']=false;
  renderReportScreen();saveLocal();
  document.getElementById('fileCamera').value='';
  document.getElementById('fileGallery').value='';
}
document.getElementById('fileCamera').onchange=e=>handleFile(e.target.files[0]);
document.getElementById('fileGallery').onchange=e=>handleFile(e.target.files[0]);

// ===== Airtableに保存 =====
document.getElementById('uploadBtn').onclick=async()=>{
  const s=loadSettings();
  const selected=items.filter(i=>i.selected);
  if(selected.length===0){toast('出力対象を選択してください');return}
  const btn=document.getElementById('uploadBtn');
  btn.classList.add('loading');btn.textContent='⏳…';
  let count=0;
  try{
    for(const item of selected){
      for(const pair of item.pairs){
        const upload=async(dataUrl,field)=>{
          const b64=dataUrl.split(',')[1];
          const mime=dataUrl.match(/data:(.*?);/)[1];
          const bytes=new Uint8Array(atob(b64).split('').map(c=>c.charCodeAt(0)));
          const blob=new Blob([bytes],{type:mime});
          const form=new FormData();
          form.append('file',blob,`photo_${Date.now()}.jpg`);
          form.append('filename',`photo_${Date.now()}.jpg`);
          const res=await fetch(`https://content.airtable.com/v0/${BASE_ID}/${item.recId}/${encodeURIComponent(field)}/uploadAttachment`,{method:'POST',headers:{'Authorization':`Bearer ${s.token}`},body:form});
          if(!res.ok)throw new Error(`${res.status}`);
          count++;
        };
        if(pair.before&&!pair.beforeIsUrl) await upload(pair.before,'指摘写真');
        if(pair.after&&!pair.afterIsUrl)   await upload(pair.after,'是正写真');
      }
    }
    toast(`${count}枚をAirtableに保存しました ✓`);
  }catch(e){toast('アップロード失敗: '+e.message)}
  finally{btn.classList.remove('loading');btn.textContent='🔗 Airtable'}
};

// ===== CSV出力 =====
document.getElementById('sheetsBtn').onclick=()=>{
  const selected=items.filter(i=>i.selected);
  if(selected.length===0){toast('出力対象を選択してください');return}
  let csv='\uFEFF';
  csv+=`検査指摘写真報告書,${todayJP()}\n\n`;
  csv+='No.,検査名,検査日,進捗,業者,指摘内容,是正内容,是正前写真URL,是正後写真URL\n';
  selected.forEach((item,i)=>{
    const atBUrl=item.pairs[0]?.beforeIsUrl?item.pairs[0].before:'';
    const atAUrl=item.pairs[0]?.afterIsUrl?item.pairs[0].after:'';
    csv+=`${i+1},"${item.kensaName}","${item.kensaDate}","${item.progress}","${item.gyosha}","${item.shitekiContent.replace(/"/g,'""')}","${item.zeseiContent.replace(/"/g,'""')}","${atBUrl}","${atAUrl}"\n`;
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`検査指摘_${todayStr()}.csv`;a.click();
  URL.revokeObjectURL(url);
  toast('CSVを保存しました');
};

// ===== PDF出力 =====
document.getElementById('pdfBtn').onclick=async()=>{
  const selected=items.filter(i=>i.selected);
  if(selected.length===0){toast('出力対象を選択してください');return}
  const btn=document.getElementById('pdfBtn');
  btn.classList.add('loading');btn.textContent='⏳…';
  toast('PDF生成中…しばらくお待ちください',10000);

  try{
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({unit:'px',format:'a4',orientation:'portrait'});
    const pw=doc.internal.pageSize.getWidth();
    const ph=doc.internal.pageSize.getHeight();
    const render=document.getElementById('pdfRender');

    // ページ分割：1ページに何指摘入るか
    // 各指摘 = ヘッダー+タイトル行 + pairs×(写真行+コメント行)
    // 写真高さ≒180px、コメント≒20px、ヘッダー≒24px、タイトル行≒20px
    // A4高さ1123px、上下余白計56px → 有効1067px
    // 1対 = 224px、1ページ約4対
    const PAIRS_PER_PAGE=4;

    // 全ペアを平坦化
    const allPairs=[];
    selected.forEach(item=>{
      item.pairs.forEach((pair,pi)=>{
        allPairs.push({item,pair,pairIdx:pi,isFirst:pi===0,isLast:pi===item.pairs.length-1});
      });
    });

    // ページ分割
    const pages=[];
    for(let i=0;i<allPairs.length;i+=PAIRS_PER_PAGE) pages.push(allPairs.slice(i,i+PAIRS_PER_PAGE));

    const kensaNameForTitle=selected[0]?.kensaName||'検査';
    const today=todayJP();

    for(let pi=0;pi<pages.length;pi++){
      const pageRows=pages[pi];
      render.innerHTML='';
      const pageDiv=document.createElement('div');
      pageDiv.className='pdf-page';
      pageDiv.innerHTML=`
        <div class="pdf-main-title">是　正　写　真</div>
        <div class="pdf-sub-title">${kensaNameForTitle}　${today}</div>`;

      // 指摘ごとにグループ
      let currentRecId=null;
      let recDiv=null;

      pageRows.forEach(row=>{
        const{item,pair,isFirst}=row;
        if(item.recId!==currentRecId){
          currentRecId=item.recId;
          recDiv=document.createElement('div');
          recDiv.className='pdf-rec';
          // 指摘ヘッダー
          const recHdr=document.createElement('div');
          recHdr.className='pdf-rec-header';
          recHdr.textContent=`${item.shitekiContent}`;
          recDiv.appendChild(recHdr);
          // 是正前・是正後タイトル行
          const titleRow=document.createElement('div');
          titleRow.className='pdf-photo-title-row';
          titleRow.innerHTML='<div class="pdf-photo-title-cell">是　正　前</div><div class="pdf-photo-title-cell">是　正　後</div>';
          recDiv.appendChild(titleRow);
          pageDiv.appendChild(recDiv);
        }

        // 写真行
        const pairDiv=document.createElement('div');
        pairDiv.className='pdf-pair';
        const photosRow=document.createElement('div');
        photosRow.className='pdf-photos-row';

        ['before','after'].forEach(side=>{
          const cell=document.createElement('div');
          cell.className='pdf-photo-cell';
          if(pair[side]){
            const img=document.createElement('img');
            img.src=pair[side];img.crossOrigin='anonymous';
            img.style.cssText='width:100%;aspect-ratio:4/3;object-fit:cover;display:block';
            cell.appendChild(img);
          }else{
            cell.innerHTML='<div class="pdf-photo-empty">（写真なし）</div>';
          }
          photosRow.appendChild(cell);
        });
        pairDiv.appendChild(photosRow);

        // コメント行
        const cmtRow=document.createElement('div');
        cmtRow.className='pdf-comment-row';
        ['before','after'].forEach(side=>{
          const cell=document.createElement('div');
          cell.className='pdf-comment-cell';
          cell.textContent=pair[side+'Comment']||'';
          cmtRow.appendChild(cell);
        });
        pairDiv.appendChild(cmtRow);
        recDiv.appendChild(pairDiv);
      });

      pageDiv.innerHTML+=`<div class="pdf-page-num">${pi+1} / ${pages.length}</div>`;
      render.appendChild(pageDiv);

      const canvas=await html2canvas(pageDiv,{scale:2,useCORS:true,allowTaint:true,backgroundColor:'#ffffff',logging:false});
      if(pi>0) doc.addPage();
      doc.addImage(canvas.toDataURL('image/jpeg',0.85),'JPEG',0,0,pw,ph);
    }

    render.innerHTML='';
    doc.save(`${kensaNameForTitle}_${todayStr()}.pdf`);
    toast('PDFを保存しました ✓');
  }catch(e){
    toast('PDF生成エラー: '+e.message);
    console.error(e);
  }finally{
    btn.classList.remove('loading');btn.textContent='📄 PDF';
  }
};

// ===== 起動 =====
const _s=loadSettings();
if(!_s.token){
  showScreen('settingsScreen');
}else{
  loadKensaNames();
  showScreen('searchScreen');
}
</script>
